name: Creek NetHunter Smart GKI
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Build jobs (auto or integer)"
        required: true
        default: "auto"
        type: string
      clean:
        description: "Clean build output"
        required: true
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      WORK: ${{ github.workspace }}/work
      KP: ${{ github.workspace }}/work/kernel_platform
      OUT_DIR: ${{ github.workspace }}/out
      DIST_DIR: ${{ github.workspace }}/out/dist
      BUILD_CONFIG: msm-kernel/build.config.msm.creek
      VARIANT: gki
      EXT_MODULES_MAKEFILE: ${{ github.workspace }}/scripts/creek-external-modules.mk
      MODULES_LIST: ${{ github.workspace }}/stock-modules/vendor_boot.modules.load
      MODULES_RECOVERY_LIST: ${{ github.workspace }}/stock-modules/vendor_boot.modules.load.recovery
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev             libncurses-dev libssl-dev libelf-dev python3 python-is-python3 bc rsync             unzip cpio lz4 xz-utils file dwarves pahole jq ca-certificates binutils lld clang
      - name: Install repo
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Sync source
        run: |
          set -euo pipefail
          mkdir -p "$WORK"; cd "$WORK"
          repo init -u "https://github.com/${GITHUB_REPOSITORY}.git" -b "${GITHUB_REF_NAME}"             -m kernel_manifest/creek.xml --repo-rev=stable --depth=1 --no-clone-bundle --no-tags
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --fail-fast -j2
      - name: Safety audit
        run: bash "$GITHUB_WORKSPACE/scripts/audit-creek-build.sh" "$KP"
      - name: Prepare and configure
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/prepare-creek-stock-safe.sh" "$KP"
          bash "$GITHUB_WORKSPACE/scripts/enable-creek-nethunter-safe.sh" "$KP"
          bash "$GITHUB_WORKSPACE/scripts/enable-creek-external-build.sh" "$KP"
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR" "$DIST_DIR" "$GITHUB_WORKSPACE/artifacts/logs"
          cd "$KP"
          if [ "${{ inputs.jobs }}" = "auto" ]; then JOBS="$(nproc --all)"; else JOBS="${{ inputs.jobs }}"; fi
          case "$JOBS" in ''|*[!0-9]*) echo "ERROR: jobs must be auto or integer"; exit 1;; esac
          export KERNEL_BUILD_JOBS="$JOBS"
          build/build.sh -j"$JOBS" 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/logs/build.log"
      - name: Verify output
        if: success()
        run: bash "$GITHUB_WORKSPACE/scripts/verify-creek-output.sh" "$KP" "$OUT_DIR" "$DIST_DIR"
      - name: Package runtime
        if: success()
        run: bash "$GITHUB_WORKSPACE/scripts/package-smart-runtime.sh" "$GITHUB_WORKSPACE" "$DIST_DIR" "$GITHUB_WORKSPACE/artifacts"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creek-nethunter-smart-gki
          path: artifacts/
          if-no-files-found: warn
