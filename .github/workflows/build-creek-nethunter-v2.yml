name: Build Creek-Nethunter v2 Unified

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Parallel jobs: auto uses nproc --all"
        required: true
        default: "auto"
        type: string
      clean:
        description: "Clean output before build"
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      WORK: ${{ github.workspace }}/work
      KP: ${{ github.workspace }}/work/kernel_platform
      OUT_DIR: ${{ github.workspace }}/out
      DIST_DIR: ${{ github.workspace }}/out/dist
      BUILD_CONFIG: msm-kernel/build.config.msm.creek
      VARIANT: gki
      LTO: thin
      SKIP_MRPROPER: ${{ inputs.clean == false && '1' || '0' }}
      KERNEL_CMDLINE_CONSOLE_AUTO: "0"
      EXT_MODULES_MAKEFILE: ${{ github.workspace }}/scripts/creek-external-modules.mk
      CREEK_DIST_DIR: ${{ github.workspace }}/out/dist
      CREEK_INJECTION_DEBUG: "1"
      MODULES_LIST: ${{ github.workspace }}/stock-modules/vendor_boot.modules.load
      MODULES_RECOVERY_LIST: ${{ github.workspace }}/stock-modules/vendor_boot.modules.load.recovery
      BUILD_VENDOR_BOOT_IMG: "1"
      VENDOR_RAMDISK_BINARY: ${{ github.workspace }}/stock-modules/vendor_boot.ramdisk.lz4

    steps:
      # ─────────────────────────────────────────
      # FASE 1: PERSIAPAN (sama seperti workflow lama)
      # ─────────────────────────────────────────
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          df -h

      - name: Install packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev \
            libncurses-dev libssl-dev libelf-dev python3 python-is-python3 bc rsync \
            unzip cpio lz4 xz-utils file dwarves pahole jq ca-certificates \
            binutils lld clang
          sudo ln -sf "$(command -v ld.lld || command -v ld.bfd)" /usr/local/bin/ld

      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Repo sync Creek sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          cd "$WORK"
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git config --global color.ui false
          repo init \
            -u "https://github.com/${GITHUB_REPOSITORY}.git" \
            -b "${GITHUB_REF_NAME}" \
            -m kernel_manifest/creek.xml \
            --repo-rev=stable \
            --depth=1 \
            --no-clone-bundle \
            --no-tags
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --fail-fast -j2
          echo "Synced projects:"
          repo list | sort

      # ─────────────────────────────────────────
      # FASE 2: APPLY PATCHES (BARU - monitor mode fix)
      # ─────────────────────────────────────────
          - name: Apply NetHunter patches
        shell: bash
        run: |
          set -euo pipefail

          QCACLD="$KP/vendor/qcom/opensource/wlan/qcacld-3.0"
          QDF="$QCACLD/qdf/src"
          HDD="$QCACLD/core/hdd/src"

          echo "=== Checking qcacld source ==="
          ls "$QCACLD" 2>/dev/null && echo "qcacld found" || echo "qcacld not found"

          # ── Patch 1: QDF_BUG → return error ──
          if [ -f "$QDF/qdf_event.c" ]; then
            echo "Applying: qdf_event panic fix"
            sed -i 's/QDF_BUG(qdf_event->cookie == COOKIE_READY_TO_WAIT);/if (qdf_event->cookie != COOKIE_READY_TO_WAIT) { QDF_TRACE(QDF_MODULE_ID_QDF, QDF_TRACE_LEVEL_ERROR, "%s: event not ready", __func__); return QDF_STATUS_E_FAILURE; }/g' \
              "$QDF/qdf_event.c"
            echo "✅ qdf_event.c patched"
          else
            echo "⚠️  qdf_event.c not found, skip"
          fi

          # ── Patch 2: NULL pointer fix ──
          if [ -f "$HDD/wlan_hdd_main.c" ]; then
            echo "Applying: NULL pointer fix"
            sed -i \
              's/vdev = ol_txrx_get_mon_vdev_from_pdev(pdev);\n\thdd_mon_stop(vdev);/vdev = ol_txrx_get_mon_vdev_from_pdev(pdev);\n\tif (!vdev) { hdd_err("mon vdev NULL"); return -EINVAL; }\n\thdd_mon_stop(vdev);/g' \
              "$HDD/wlan_hdd_main.c" || true

            # Cara alternatif pakai Python dengan path yang sudah di-expand
            python3 << PYEOF
          import re, sys

          path = "$HDD/wlan_hdd_main.c"
          try:
              with open(path, 'r') as f:
                  content = f.read()
          except FileNotFoundError:
              print(f"File not found: {path}")
              sys.exit(0)

          old = 'vdev = ol_txrx_get_mon_vdev_from_pdev(pdev);\n\thdd_mon_stop(vdev);'
          new = ('vdev = ol_txrx_get_mon_vdev_from_pdev(pdev);\n'
                 '\tif (!vdev) {\n'
                 '\t\thdd_err("mon vdev NULL, safely skipping");\n'
                 '\t\treturn -EINVAL;\n'
                 '\t}\n'
                 '\thdd_mon_stop(vdev);')

          if old in content:
              content = content.replace(old, new)
              with open(path, 'w') as f:
                  f.write(content)
              print("✅ NULL pointer patch applied")
          else:
              print("⚠️  Pattern not found, may differ or already patched")
          PYEOF
          else
            echo "⚠️  wlan_hdd_main.c not found at $HDD"
            echo "Searching alternative path..."
            find "$QCACLD" -name "wlan_hdd_main.c" 2>/dev/null | head -5
          fi

          # ── Apply patch files dari patches/common/ ──
          PATCHDIR="${GITHUB_WORKSPACE}/patches/common"
          if [ -d "$PATCHDIR" ]; then
            for patch in "$PATCHDIR"/*.patch; do
              [ -f "$patch" ] || continue
              echo "Applying: $(basename $patch)"
              cd "$KP"
              git apply --ignore-whitespace "$patch" 2>/dev/null \
                && echo "✅ $(basename $patch)" \
                || echo "⚠️  $(basename $patch) skip"
            done
          fi

          echo "=== Patches done ==="

      - name: Prepare Creek stock layout
        shell: bash
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/scripts/prepare-creek-stock.sh" "$KP"
          "${GITHUB_WORKSPACE}/scripts/enable-creek-nethunter.sh" "$KP"
          "${GITHUB_WORKSPACE}/scripts/enable-creek-external-build.sh" "$KP"
          printf 'KERNEL_VENDOR_CMDLINE=%s\n' "$(cat "$GITHUB_WORKSPACE/stock-modules/vendor_boot.cmdline")" >> "$GITHUB_ENV"
          echo "Common build constants:"
          cat "$KP/common/build.config.constants" 2>/dev/null || true
          echo "MSM build constants:"
          cat "$KP/msm-kernel/build.config.constants" 2>/dev/null || true
          echo "Expected clang:"
          ls -d "$KP/prebuilts/clang/host/linux-x86"/clang-r*/bin/clang
          "$KP/prebuilts/clang/host/linux-x86/clang-r450784e/bin/clang" --version | head -n1

      # ─────────────────────────────────────────
      # FASE 3: BUILD (sama seperti workflow lama)
      # ─────────────────────────────────────────
      - name: Build Creek-Nethunter v2 kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR" "$DIST_DIR" "$GITHUB_WORKSPACE/artifacts/logs"
          cd "$KP"
          if [ "${{ inputs.jobs }}" = "auto" ]; then
            JOBS="$(nproc --all)"
          else
            JOBS="${{ inputs.jobs }}"
          fi
          export KERNEL_BUILD_JOBS="$JOBS"
          {
            echo "BUILD_CONFIG=$BUILD_CONFIG"
            echo "VARIANT=$VARIANT"
            echo "Started at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            build/build.sh -j"$JOBS"
            echo "Finished at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/logs/build-creek-nethunter-v2.log"

      - name: Verify module placement
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/logs"
          "$GITHUB_WORKSPACE/scripts/verify-creek-module-placement.sh" \
            "$KP" "$OUT_DIR" "$DIST_DIR" \
            "$GITHUB_WORKSPACE/stock-modules" \
            "$GITHUB_WORKSPACE/artifacts/logs/module-placement.txt"

      # ─────────────────────────────────────────
      # FASE 4: PACK UNIFIED AK3 ZIP (BARU)
      # ─────────────────────────────────────────
      - name: Clone AnyKernel3
        if: success()
        shell: bash
        run: |
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3 \
            "$GITHUB_WORKSPACE/ak3"

      - name: Prepare AnyKernel3 structure
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          AK3="${GITHUB_WORKSPACE}/ak3"

          # ── Copy kernel image ──
          if [ -f "$DIST_DIR/Image.gz" ]; then
            cp -f "$DIST_DIR/Image.gz" "$AK3/Image.gz"
            echo "✅ Image.gz copied"
          elif [ -f "$DIST_DIR/Image" ]; then
            gzip -c "$DIST_DIR/Image" > "$AK3/Image.gz"
            echo "✅ Image.gz made from Image"
          else
            echo "❌ No kernel image found"
            exit 1
          fi

          # ── Buat struktur modul ──
          mkdir -p "$AK3/modules/system/lib/modules"
          mkdir -p "$AK3/modules/vendor/lib/modules"

          # ── Collect semua modul yang dibangun ──
          echo "=== Collecting all built modules ==="

          # Modul stock vendor (dari DIST_DIR/vendor_dlkm atau staging)
          STOCK_VENDOR_MODS=(
            "bootinfo.ko"
            "mi_memory.ko"
            "mi_thermal_interface.ko"
            "qrng_dlkm.ko"
            "qseecom_dlkm.ko"
            "swinfo.ko"
            "ipam.ko"
            "ipanetm.ko"
            "ipa_clientsm.ko"
            "rndisipam.ko"
            "rmnet_core.ko"
            "rmnet_ctl.ko"
            "rmnet_wlan.ko"
            "hdcp_qseecom_dlkm.ko"
            "lct_tp.ko"
            "msm-mmrm.ko"
            "msm_drm.ko"
            "smcinvoke_dlkm.ko"
          )

          # Cari dan taruh semua modul
          for root in "$OUT_DIR/staging" "$OUT_DIR/gki_kernel/common" "$OUT_DIR/msm-kernel" "$DIST_DIR"; do
            [ -d "$root" ] || continue
            find "$root" -type f -name "*.ko" | while read ko; do
              name=$(basename "$ko")
              is_stock=0
              for smod in "${STOCK_VENDOR_MODS[@]}"; do
                if [ "$name" = "$smod" ]; then
                  is_stock=1
                  break
                fi
              done

              if [ "$is_stock" = "1" ]; then
                cp -f "$ko" "$AK3/modules/vendor/lib/modules/" 2>/dev/null || true
              else
                cp -f "$ko" "$AK3/modules/system/lib/modules/" 2>/dev/null || true
              fi
            done
          done

          echo "System modules: $(ls $AK3/modules/system/lib/modules/ | wc -l)"
          echo "Vendor modules: $(ls $AK3/modules/vendor/lib/modules/ | wc -l)"
          echo "All modules:"
          ls "$AK3/modules/system/lib/modules/"
          echo "---"
          ls "$AK3/modules/vendor/lib/modules/" 2>/dev/null || true

      - name: Write anykernel.sh
        if: success()
        shell: bash
        run: |
          AK3="${GITHUB_WORKSPACE}/ak3"
          cat > "$AK3/anykernel.sh" << 'AKEOF'
          # AnyKernel3 properties
          properties() { '
          kernel.string=Creek-Nethunter v2 Unified
          do.devicecheck=1
          do.modules=1
          do.systemmodules=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=creek
          device.name2=Redmi15
          supported.versions=13-15
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;

          # ── Install semua modul (unified) ──
          ui_print " ";
          ui_print "   Creek-Nethunter v2 Unified";
          ui_print "   by dr1408 + Ferztie666";
          ui_print " ";
          ui_print "- Installing system modules...";
          copy_ak modules/system/lib/modules/ /system/lib/modules/;
          set_perm_recursive /system/lib/modules root root 644 755;

          ui_print "- Installing vendor modules...";
          copy_ak modules/vendor/lib/modules/ /vendor/lib/modules/;
          set_perm_recursive /vendor/lib/modules root root 644 755;

          # ── Install NHD smart daemon ──
          ui_print "- Installing NHD daemon...";
          copy_ak system/bin/nhd /system/bin/nhd;
          set_perm /system/bin/nhd root root 0755;

          ui_print " ";
          ui_print "- Done! Reboot to apply.";
          ui_print " ";
          AKEOF

      - name: Write NHD smart daemon
        if: success()
        shell: bash
        run: |
          AK3="${GITHUB_WORKSPACE}/ak3"
          mkdir -p "$AK3/system/bin"
          cat > "$AK3/system/bin/nhd" << 'NHDEOF'
          #!/system/bin/sh
          # NHD - NetHunter Daemon v2 (Creek)
          # Auto USB hotplug + WiFi safe switch + Context mode

          LOG=/data/nhsystem/nhd.log
          KO_MON=/system/lib/modules/qca_cld3_wlan.ko
          KO_STOCK=/vendor_dlkm/lib/modules/qca_cld3_wlan.ko
          SYSFS_CH=/sys/devices/platform/soc/c800000.qcom,icnss/net/wlan0/monitor_mode_channel
          SYSFS_TYPE=/sys/class/net/wlan0/type
          MOD=/system/lib/modules

          mkdir -p /data/nhsystem
          log_nhd() { echo "[$(date '+%H:%M:%S')] $1" >> "$LOG"; }
          ismon() { [ "$(cat $SYSFS_TYPE 2>/dev/null)" = "803" ]; }

          # ── USB hotplug handler ──
          usb_load() {
            DEV="$1"
            VID=$(cat /sys/bus/usb/devices/$DEV/idVendor 2>/dev/null)
            PID=$(cat /sys/bus/usb/devices/$DEV/idProduct 2>/dev/null)
            [ -z "$VID" ] && return
            log_nhd "USB plugged: ${VID}:${PID}"
            case "${VID}:${PID}" in
              # WiFi adapters
              0bda:8812) insmod $MOD/rtw_core.ko 2>/dev/null
                         insmod $MOD/rtw_usb.ko 2>/dev/null
                         insmod $MOD/rtw_8812au.ko 2>/dev/null
                         log_nhd "Loaded: Alfa AWUS036ACH (rtw_8812au)" ;;
              0bda:c811) insmod $MOD/rtw_core.ko 2>/dev/null
                         insmod $MOD/rtw_8821cu.ko 2>/dev/null
                         log_nhd "Loaded: rtw_8821cu" ;;
              0bda:8179) insmod $MOD/rtl8xxxu.ko 2>/dev/null
                         log_nhd "Loaded: RTL8188EU (rtl8xxxu)" ;;
              0cf3:9271) insmod $MOD/ath9k_htc.ko 2>/dev/null
                         log_nhd "Loaded: AR9271 (ath9k_htc)" ;;
              148f:7601) insmod $MOD/mt76.ko 2>/dev/null
                         insmod $MOD/mt7601u.ko 2>/dev/null
                         log_nhd "Loaded: MT7601U (mt7601u)" ;;
              148f:761a|148f:7612)
                         insmod $MOD/mt76.ko 2>/dev/null
                         insmod $MOD/mt76x2u.ko 2>/dev/null
                         log_nhd "Loaded: MT7612U (mt76x2u)" ;;
              # SDR
              1d50:6089) insmod $MOD/hackrf.ko 2>/dev/null
                         log_nhd "Loaded: HackRF One" ;;
              1d50:60a1) insmod $MOD/airspy.ko 2>/dev/null
                         log_nhd "Loaded: Airspy" ;;
              0bda:2838) insmod $MOD/rtl2832.ko 2>/dev/null
                         insmod $MOD/rtl2832_sdr.ko 2>/dev/null
                         log_nhd "Loaded: RTL-SDR (RTL2832U)" ;;
              # Serial / Tools
              10c4:ea60) insmod $MOD/cp210x.ko 2>/dev/null
                         log_nhd "Loaded: CP2102 (ESP32/serial)" ;;
              067b:2303) insmod $MOD/pl2303.ko 2>/dev/null
                         log_nhd "Loaded: PL2303" ;;
              # NFC
              072f:2200) insmod $MOD/pn533.ko 2>/dev/null
                         insmod $MOD/pn533_usb.ko 2>/dev/null
                         log_nhd "Loaded: ACR122U (pn533)" ;;
              # iButton
              04b4:0004) insmod $MOD/wire.ko 2>/dev/null
                         insmod $MOD/ds2490.ko 2>/dev/null
                         log_nhd "Loaded: DS9490R (iButton)" ;;
              # Proxmark3
              2d2d:504d) log_nhd "Proxmark3 detected (use cdc_acm)" ;;
              *) log_nhd "USB unknown: ${VID}:${PID}" ;;
            esac
          }

          usb_unload() {
            DEV="$1"
            VID=$(cat /sys/bus/usb/devices/$DEV/idVendor 2>/dev/null)
            PID=$(cat /sys/bus/usb/devices/$DEV/idProduct 2>/dev/null)
            log_nhd "USB removed: ${VID}:${PID}"
          }

          # ── WiFi wlan0 → monitor (aman, tanpa panic) ──
          wifi_mon_on() {
            ismon && { log_nhd "wlan0 already monitor"; return 0; }
            log_nhd "Switching wlan0 → monitor mode"
            svc wifi disable
            sleep 3
            rmmod wlan 2>/dev/null
            sleep 1
            insmod "$KO_MON" con_mode=4
            sleep 8
            ip link set wlan0 up
            CH="${1:-6}"
            echo "$CH 0" > "$SYSFS_CH"
            log_nhd "wlan0 monitor ON (ch${CH})"
          }

          # ── WiFi wlan0 → managed (aman) ──
          wifi_man_on() {
            ! ismon && { log_nhd "wlan0 already managed"; return 0; }
            log_nhd "Switching wlan0 → managed mode"
            rmmod wlan 2>/dev/null
            sleep 2
            insmod "$KO_STOCK"
            sleep 5
            svc wifi enable
            log_nhd "wlan0 managed ON"
          }

          # ── Ganti channel (hanya saat monitor) ──
          wifi_ch() {
            if ! ismon; then
              log_nhd "wlan0 not in monitor, switch first"
              return 1
            fi
            echo "${1:-6} 0" > "$SYSFS_CH"
            log_nhd "wlan0 channel → ${1:-6}"
          }

          # ── Handle perintah langsung ──
          case "$1" in
            mon)    wifi_mon_on "${2:-6}" ;;
            managed) wifi_man_on ;;
            ch)     wifi_ch "${2:-6}" ;;
            status) ismon && echo "wlan0: MONITOR (type=803)" || echo "wlan0: MANAGED (type=1)" ;;
            *)
              # Main loop daemon
              log_nhd "NHD v2 started (daemon mode)"
              PREV_LIST=""
              while true; do
                # Scan USB
                CUR_LIST=$(ls /sys/bus/usb/devices/ 2>/dev/null | sort)
                if [ "$CUR_LIST" != "$PREV_LIST" ]; then
                  for dev in /sys/bus/usb/devices/*/idVendor; do
                    dir=$(dirname "$dev")
                    devname=$(basename "$dir")
                    flag="$dir/.nhd_done"
                    [ -f "$flag" ] && continue
                    touch "$flag"
                    usb_load "$devname" &
                  done
                  PREV_LIST="$CUR_LIST"
                fi
                sleep 5
              done
              ;;
          esac
          NHDEOF
          chmod 755 "$AK3/system/bin/nhd"
          echo "✅ NHD daemon written"

      - name: Pack unified AK3 zip
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          AK3="${GITHUB_WORKSPACE}/ak3"
          ZIPNAME="Creek-Nethunter-v2-Unified-$(date '+%Y%m%d-%H%M').zip"

          echo "=== Final AK3 structure ==="
          find "$AK3" -not -path "*/.git/*" -type f | sort

          cd "$AK3"
          zip -r9 "${GITHUB_WORKSPACE}/artifacts/${ZIPNAME}" \
            . -x "*.git*" -x "*.github*"

          echo "✅ ZIP: $ZIPNAME"
          ls -lah "${GITHUB_WORKSPACE}/artifacts/${ZIPNAME}"

      # ─────────────────────────────────────────
      # FASE 5: COLLECT + UPLOAD (gabungan lama + baru)
      # ─────────────────────────────────────────
      - name: Collect artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/artifacts/logs"
          mkdir -p "${GITHUB_WORKSPACE}/artifacts/wlan-modules"
          mkdir -p "${GITHUB_WORKSPACE}/artifacts/nethunter-modules"

          # Config logs
          cp -f "$OUT_DIR/gki_kernel/common/.config" "${GITHUB_WORKSPACE}/artifacts/logs/gki.config" 2>/dev/null || true
          cp -f "$OUT_DIR/msm-kernel/.config" "${GITHUB_WORKSPACE}/artifacts/logs/msm.config" 2>/dev/null || true
          cp -f "$OUT_DIR/msm-kernel/Module.symvers" "${GITHUB_WORKSPACE}/artifacts/logs/msm.Module.symvers" 2>/dev/null || true

          # Module list
          for root in "$OUT_DIR/staging" "$OUT_DIR/gki_kernel/common" "$OUT_DIR/msm-kernel"; do
            if [ -d "$root" ]; then
              find "$root" -type f -name '*.ko' -printf '%f\n' 2>/dev/null
            fi
          done | sort -u > "${GITHUB_WORKSPACE}/artifacts/logs/built-module-names.txt"

          # WLAN modules (untuk testing cepat)
          if [ -d "$OUT_DIR/staging" ]; then
            find "$OUT_DIR/staging" -type f \
              \( -path '*/wlan/qcacld-3.0/*.ko' \
                 -o -path '*/nethunter/rtw88/*.ko' \
                 -o -path '*/nethunter/rtl8xxxu/*.ko' \
                 -o -path '*/wireless/mediatek/*.ko' \
                 -o -path '*/wireless/realtek/*.ko' \
                 -o -name 'mt76*.ko' \
                 -o -name 'mt7601u.ko' \) \
              -exec cp -f {} "${GITHUB_WORKSPACE}/artifacts/wlan-modules/" \; 2>/dev/null || true
          fi

          # NH modules
          for root in "$OUT_DIR/staging" "$OUT_DIR/gki_kernel/common" "$OUT_DIR/msm-kernel"; do
            [ -d "$root" ] || continue
            find "$root" -type f \
              \( -name "mt76*.ko" -o -name "mt7601u.ko" \
                 -o -name "cfg80211.ko" -o -name "mac80211.ko" \
                 -o -name "tcp_bic.ko" -o -name "tcp_westwood.ko" \
                 -o -name "tcp_htcp.ko" \) \
              -exec cp -f {} "${GITHUB_WORKSPACE}/artifacts/nethunter-modules/" \; 2>/dev/null || true
          done

          # Dist files penting
          if [ -d "$DIST_DIR" ]; then
            IMPORTANT_FILES=(
              Image Image.gz Image.lz4
              boot.img boot-gz.img boot-lz4.img
              init_boot.img vendor_boot.img
              dtb.img dtbo.img
              system_dlkm.img vendor_dlkm.img
              system_dlkm.modules.load
              vendor_dlkm.modules.load
              gki-info.txt
            )
            for f in "${IMPORTANT_FILES[@]}"; do
              [ -f "$DIST_DIR/$f" ] && cp -f "$DIST_DIR/$f" "${GITHUB_WORKSPACE}/artifacts/"
            done
            find "$DIST_DIR" -maxdepth 1 -type f \
              \( -name '*modules.load' -o -name '*modules.blocklist' \
                 -o -name '*dtb*.img' -o -name '*dtbo*.img' \) \
              -exec cp -f {} "${GITHUB_WORKSPACE}/artifacts/" \;
          fi

          echo "=== All artifacts ==="
          find "${GITHUB_WORKSPACE}/artifacts" -maxdepth 2 -type f \
            -printf '%P %s bytes\n' | sort || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creek-nethunter-v2-unified
          path: artifacts/
          if-no-files-found: warn
