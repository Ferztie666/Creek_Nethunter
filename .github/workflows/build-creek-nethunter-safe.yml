name: Creek NetHunter Safe Build

permissions:
  contents: read
  actions: read

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      jobs:
        description: "Build jobs; auto is recommended"
        required: true
        default: "auto"
        type: string
      clean:
        description: "Clean output before build"
        required: true
        default: true
        type: boolean

concurrency:
  group: creek-nethunter-safe-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      WORK: ${{ github.workspace }}/work
      KP: ${{ github.workspace }}/work/kernel_platform
      OUT_DIR: ${{ github.workspace }}/out
      DIST_DIR: ${{ github.workspace }}/out/dist
      BUILD_CONFIG: msm-kernel/build.config.msm.creek
      VARIANT: gki
      LTO: thin
      # Match the original developer kernel/adapter package release exactly.
      # The final build log showed LOCALVERSION did not include android13-8;
      # pass the full suffix explicitly so kernelrelease/vermagic agree.
      LOCALVERSION: -android13-8-gbf0a81a7f319-dirty
      EXPECTED_KERNEL_RELEASE: 5.15.167-android13-8-gbf0a81a7f319-dirty
      SKIP_MRPROPER: ${{ github.event_name == 'workflow_dispatch' && inputs.clean == false && '1' || '0' }}
      KERNEL_CMDLINE_CONSOLE_AUTO: "0"
      EXT_MODULES_MAKEFILE: ${{ github.workspace }}/scripts/creek-external-modules.mk
      CREEK_DIST_DIR: ${{ github.workspace }}/out/dist
      MODULES_LIST: ${{ github.workspace }}/stock-modules/vendor_boot.modules.load
      MODULES_RECOVERY_LIST: ${{ github.workspace }}/stock-modules/vendor_boot.modules.load.recovery
      BUILD_VENDOR_BOOT_IMG: "1"
      VENDOR_RAMDISK_BINARY: ${{ github.workspace }}/stock-modules/vendor_boot.ramdisk.lz4

    steps:
      - uses: actions/checkout@v5

      - name: Host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev \
            libncurses-dev libssl-dev libelf-dev python3 python-is-python3 bc rsync \
            unzip cpio lz4 xz-utils file dwarves pahole jq ca-certificates binutils lld clang kmod
          sudo ln -sf "$(command -v ld.lld || command -v ld.bfd)" /usr/local/bin/ld

      - name: Swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Repo tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync exact Creek manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          cd "$WORK"
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
          repo init -u "https://github.com/${GITHUB_REPOSITORY}.git" \
            -b "${GITHUB_REF_NAME}" -m kernel_manifest/creek.xml \
            --repo-rev=stable --depth=1 --no-clone-bundle --no-tags
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --fail-fast -j2

      - name: Apply audited QCACLD monitor safety fix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/logs"
          bash -n scripts/patch-creek-qcacld-monitor.sh
          bash scripts/patch-creek-qcacld-monitor.sh "$KP" "$GITHUB_WORKSPACE" 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/logs/monitor-patch-status.txt"

      - name: Source safety audit
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/creek-safe-preflight.sh scripts/prepare-creek-stock.sh scripts/enable-creek-nethunter.sh scripts/enable-creek-adapter-configs.sh scripts/package-creek-adapters.sh scripts/verify-creek-safe-output.sh scripts/verify-creek-stock-module-policy.sh scripts/patch-creek-qcacld-monitor.sh scripts/verify-creek-adapter-release.sh scripts/reconcile-creek-gki-module-list.sh scripts/guard-creek-ak3.sh; do bash -n "$f"; done
          for f in scripts/nhd scripts/nh-load.sh scripts/nh-action.sh; do sh -n "$f"; done
          # Keep the known-incompatible third-party rtw88 fork out of the
          # default module stage. Its MODPOST failure (undefined skb_copy_header)
          # must not be bypassed or silently ignored.
          if grep -Eq '^all:.*rtw88([[:space:]]|$)' scripts/creek-external-modules.mk; then
            echo "ERROR: incompatible rtw88 must remain quarantined from default build until source/KMI audit passes" >&2
            exit 1
          fi
          bash scripts/creek-safe-preflight.sh "$KP" "$GITHUB_WORKSPACE"

      - name: Prepare Creek source layout and preserve ABI checker
        shell: bash
        run: |
          set -euo pipefail
          ABI_BEFORE=""
          for f in "$KP/build/abi/compare_to_symbol_list" "$KP/build/kernel/abi/compare_to_symbol_list"; do
            if [ -f "$f" ]; then ABI_BEFORE="$(readlink -f "$f")"; break; fi
          done
          test -n "$ABI_BEFORE"
          ! grep -q 'BUT WHO CARES?' "$ABI_BEFORE" || {
            echo "Unexpected pre-existing ABI bypass before preparation" >&2
            exit 1
          }
          scripts/prepare-creek-stock.sh "$KP"
          # The preparation script must never rewrite or bypass the ABI checker.
          # Treat any marker as a hard failure before compilation.
          if grep -qE 'BUT WHO CARES?|ABI_BYPASS|abi-bypass' "$ABI_BEFORE"; then
            echo "ERROR: ABI/KMI checker bypass detected after preparation" >&2
            exit 1
          fi
          echo "ABI/KMI_CHECKER=ACTIVE; mismatch must fail the build."

      - name: Apply NetHunter configuration safely
        shell: bash
        run: |
          set -euo pipefail
          # BBG is part of the requested security configuration and is currently
          # integrated by enable-creek-nethunter.sh. Its upstream revision is not
          # pinned yet; record the exact checked-out SHA and keep flash authorization
          # blocked until that revision is audited for this Android 13/5.15 GKI.
          cp scripts/enable-creek-nethunter.sh "$RUNNER_TEMP/enable-creek-nethunter.sh"
          # BBRv3 remains disabled because the pinned KMI rejects tcp_cong_avoid_ai.
          mkdir -p "$GITHUB_WORKSPACE/artifacts/logs"
          # Do not hide the first failing command. Keep the build strict, but
          # expose the exact NetHunter patch/config operation that failed.
          set +e
          bash -x "$RUNNER_TEMP/enable-creek-nethunter.sh" "$KP" "$GITHUB_WORKSPACE" 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/logs/nethunter-config.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "ERROR: NetHunter configuration failed (rc=$rc)."
            echo "---- last 160 lines of nethunter-config.log ----"
            tail -n 160 "$GITHUB_WORKSPACE/artifacts/logs/nethunter-config.log" || true
            exit "$rc"
          fi
          BBG_DIR="$KP/common/Baseband-guard"
          test -d "$BBG_DIR/.git" || { echo "ERROR: BBG setup reported success but source checkout is missing" >&2; exit 1; }
          {
            echo "BBG_SOURCE_COMMIT=$(git -C "$BBG_DIR" rev-parse HEAD)"
            echo "BBG_SOURCE_PINNED=NO"
            echo "BBG_STATUS=BUILT_FROM_UPSTREAM_REF_BY_SETUP_SCRIPT_FLASH_BLOCKED"
          } | tee "$GITHUB_WORKSPACE/artifacts/logs/baseband-guard-source.txt"
          bash -n scripts/enable-creek-adapter-configs.sh
          bash scripts/enable-creek-adapter-configs.sh "$KP" "$GITHUB_WORKSPACE/artifacts/logs/adapter-config-status.txt"

      - name: NetHunter post-config audit
        shell: bash
        run: |
          set -euo pipefail
          echo "== NETHUNTER POST-CONFIG AUDIT =="
          test -f "$KP/common/arch/arm64/configs/nethunter.config"
          echo "-- selected fragment --"
          grep -E '^CONFIG_(TCP_CONG_BBR3|DEFAULT_BBR3|DEFAULT_TCP_CONG|SYSVIPC|PID_NS|USER_NS|POSIX_MQUEUE|NET_SCH_FQ|NET_SCH_FQ_CODEL|NET_SCH_CAKE|CAN|USB_SERIAL|IP_SET)=' \
            "$KP/common/arch/arm64/configs/nethunter.config" || true
          echo "-- patch state --"
          for p in gki-ptrace.patch droidspaces-sysvipc-kabi-6-7-8.patch droidspaces-cgroup-prefix.patch; do
            echo "checking $p"
            if git -C "$KP/common" apply --reverse --check "$GITHUB_WORKSPACE/patches/common/$p" >/dev/null 2>&1; then
              echo "APPLIED: $p"
            else
              echo "WARNING: could not prove applied state for $p"
            fi
          done
          ABI_CHECKER=""
          for f in "$KP/build/abi/compare_to_symbol_list" "$KP/build/kernel/abi/compare_to_symbol_list"; do
            if [ -f "$f" ]; then ABI_CHECKER="$(readlink -f "$f")"; break; fi
          done
          test -n "$ABI_CHECKER"
          if grep -qE 'BUT WHO CARES?|ABI_BYPASS|abi-bypass' "$ABI_CHECKER"; then
            echo "ERROR: ABI/KMI checker bypass detected before build" >&2
            exit 1
          fi
          if grep -Eq '^CONFIG_(TCP_CONG_BBR3|DEFAULT_BBR3)=y$' "$KP/common/arch/arm64/configs/nethunter.config"; then
            echo "ERROR: BBRv3 is not approved for this pinned GKI KMI baseline" >&2
            grep -nE '^CONFIG_(TCP_CONG_BBR3|DEFAULT_BBR3)=y$' "$KP/common/arch/arm64/configs/nethunter.config" >&2
            exit 1
          fi
          echo "BBRv3=DISABLED_PENDING_KMI_VALIDATION"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR" "$DIST_DIR" "$GITHUB_WORKSPACE/artifacts/logs"
          cd "$KP"
          REQUESTED_JOBS="${{ inputs.jobs || 'auto' }}"
          if [ "$REQUESTED_JOBS" = "auto" ]; then JOBS=2; else JOBS="$REQUESTED_JOBS"; fi
          case "$JOBS" in ''|*[!0-9]*) echo "ERROR: jobs must be auto or a positive integer" >&2; exit 2 ;; esac
          if [ "$JOBS" -lt 1 ] || [ "$JOBS" -gt 8 ]; then echo "ERROR: jobs must be between 1 and 8" >&2; exit 2; fi
          export KERNEL_BUILD_JOBS="$JOBS"
          export BUILD_CONFIG VARIANT LTO SKIP_MRPROPER KERNEL_CMDLINE_CONSOLE_AUTO
          export EXT_MODULES_MAKEFILE CREEK_DIST_DIR MODULES_LIST MODULES_RECOVERY_LIST
          export EXPECTED_KERNEL_RELEASE
          # CONFIG_LOCALVERSION is the single source of truth for the kernel release.
          unset LOCALVERSION
          export BUILD_VENDOR_BOOT_IMG VENDOR_RAMDISK_BINARY
          set +e
          build/build.sh -j"$JOBS" 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/logs/build.log"
          build_rc=${PIPESTATUS[0]}
          set -e
          if [ "$build_rc" -ne 0 ]; then
            # The pinned Android build checks common/android/gki_aarch64_modules
            # against the resolved modules.order. NetHunter intentionally enables
            # a reviewed set of extra GKI modules, so reconcile only that exact
            # allowlisted delta and rerun once. Never touch the ABI/KMI symbol list.
            if grep -Fq "ERROR: modules list out of date" "$GITHUB_WORKSPACE/artifacts/logs/build.log" &&
               [ -s "$OUT_DIR/gki_kernel/common/modules.order" ] &&
               [ -s "$KP/common/android/gki_aarch64_modules" ]; then
              bash "$GITHUB_WORKSPACE/scripts/reconcile-creek-gki-module-list.sh" \
                "$OUT_DIR/gki_kernel/common/modules.order" \
                "$KP/common/android/gki_aarch64_modules" \
                "$GITHUB_WORKSPACE/artifacts/logs/gki-module-list-reconcile.txt"
              echo "Retrying build once after explicitly reviewed GKI module-list reconciliation."
              build/build.sh -j"$JOBS" 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/logs/build-retry.log"
            else
              exit "$build_rc"
            fi
          fi
          # Fail closed if build.config/Kbuild drops the localversion. The previous
          # build produced vermagic 5.15.167 only, so every original adapter .ko was
          # rejected before symbol-CRC checking. Never package a shortened release.
          bash "$GITHUB_WORKSPACE/scripts/verify-creek-adapter-release.sh" "$OUT_DIR/staging" "$EXPECTED_KERNEL_RELEASE" "$GITHUB_WORKSPACE/artifacts/logs/module-release-audit.txt" "$OUT_DIR/gki_kernel/staging"
          # Never package a candidate if the build scripts changed or bypassed
          # the authoritative ABI checker during compilation.
          ABI_CHECKER=""
          for f in "$KP/build/abi/compare_to_symbol_list" "$KP/build/kernel/abi/compare_to_symbol_list"; do
            if [ -f "$f" ]; then ABI_CHECKER="$(readlink -f "$f")"; break; fi
          done
          test -n "$ABI_CHECKER"
          if grep -qE 'BUT WHO CARES?|ABI_BYPASS|abi-bypass' "$ABI_CHECKER"; then
            echo "ERROR: ABI/KMI checker bypass detected after build" >&2
            exit 1
          fi
          echo "ABI/KMI_CHECKER=ACTIVE_AFTER_BUILD"

      - name: Requested feature configuration audit
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/logs"
          REPORT="$GITHUB_WORKSPACE/artifacts/logs/requested-feature-config-status.txt"
          : > "$REPORT"
          echo "Creek NetHunter requested feature configuration audit" | tee -a "$REPORT"
          echo "CONFIG_SOURCE_FAMILY=5.15.167-android13-8" | tee -a "$REPORT"
          echo "CURRENT_STOCK_FAMILY=5.15.194-android13-8-00019-gf4321180a397-ab15212794" | tee -a "$REPORT"
          echo "FLASH_ALLOWED=NO" | tee -a "$REPORT"
          echo "Absent options are not assumed enabled." | tee -a "$REPORT"
          symbols='CFG80211_INTERNAL_REGDB CFG80211_CRDA_SUPPORT MAC80211 MAC80211_MESH NFC NFC_NCI NFC_LLCP NFC_DIGITAL NFC_HCI MEDIA_SUPPORT MEDIA_SDR_SUPPORT USB_AIRSPY USB_HACKRF LIRC RC_CORE IR_LIRC_CODEC USB_SERIAL USB_SERIAL_CP210X USB_SERIAL_CH341 USB_SERIAL_FTDI_SIO USB_SERIAL_PL2303 USB_SERIAL_CP210X USB_CONFIGFS_F_HID USB_CONFIGFS_MASS_STORAGE USB_CONFIGFS_F_SERIAL USB_CONFIGFS_ECM USB_U_ETHER USB_F_RNDIS TUN WIREGUARD IP_SET NF_TABLES NF_CONNTRACK NF_NAT NFS_FS NFSD KALLSYMS KALLSYMS_ALL BPF BPF_SYSCALL KPROBES FTRACE FUNCTION_TRACER PID_NS USER_NS NET_NS IPC_NS UTS_NS CGROUPS PACKET AF_PACKET PACKET_DIAG CAN CAN_RAW CAN_BCM CAN_DEV CAN_ISOTP CAN_J1939 CAN_SLCAN CAN_GW CAN_VCAN BT BT_BREDR BT_LE BT_HS BT_6LOWPAN BT_HCIBTUSB BRIDGE MAC802154 IEEE802154 IEEE802154_6LOWPAN AF_ALG CRYPTO_USER LZ4_COMPRESS ZRAM ZSMALLOC PANIC_ON_OOPS PANIC_TIMEOUT LOCKUP_DETECTOR SOFTLOCKUP_DETECTOR HARDLOCKUP_DETECTOR WQ_WATCHDOG THERMAL_GOV_POWER_ALLOCATOR CPU_FREQ_GOV_SCHEDUTIL BFQ_GROUP_IOSCHED W1 W1_MASTER_DS2490 W1_SLAVE_THERM W1_SLAVE_DS2431 W1_SLAVE_DS2433 W1_SLAVE_DS2408'
          # Audit the actual Kconfig outputs used by the two build domains.
          # DIST_DIR/.config is not a reliable source of truth for this mixed GKI/MSM build.
          GKI_CFG="$OUT_DIR/gki_kernel/common/.config"
          MSM_CFG="$OUT_DIR/msm-kernel/.config"
          [ -s "$GKI_CFG" ] || { echo "ERROR: final GKI config missing: $GKI_CFG" | tee -a "$REPORT" >&2; exit 1; }
          [ -s "$MSM_CFG" ] || { echo "ERROR: final MSM config missing: $MSM_CFG" | tee -a "$REPORT" >&2; exit 1; }
          echo "GKI_CONFIG_FILE=$GKI_CFG" | tee -a "$REPORT"
          echo "MSM_CONFIG_FILE=$MSM_CFG" | tee -a "$REPORT"
          audit_config() {
            local domain="$1" cfg="$2" symbol value
            for symbol in $symbols; do
              value="$(sed -n "s/^CONFIG_${symbol}=//p" "$cfg" | head -n1)"
              if [ -n "$value" ]; then
                echo "${domain}_CONFIG_${symbol}=$value" | tee -a "$REPORT"
              elif grep -qx "# CONFIG_${symbol} is not set" "$cfg"; then
                echo "${domain}_CONFIG_${symbol}=n" | tee -a "$REPORT"
              else
                echo "${domain}_CONFIG_${symbol}=ABSENT_OR_UNSUPPORTED" | tee -a "$REPORT"
              fi
            done
          }
          audit_config GKI "$GKI_CFG"
          audit_config MSM "$MSM_CFG"
          echo "PANIC_POLICY=UPSTREAM_FINAL_CONFIG; no forced panic-on-oops override" | tee -a "$REPORT"
          echo "FEATURE_CONFIG_AUDIT=PASS_REPORT_ONLY_NOT_FLASH_AUTHORIZATION" | tee -a "$REPORT"

      - name: Final safety verification
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-creek-safe-output.sh "$KP" "$OUT_DIR" "$DIST_DIR" "$GITHUB_WORKSPACE/artifacts/logs"

      - name: Package release artifacts
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/release artifacts/modules artifacts/adapter-module Creek-Nethunter-gki-candidate.zip Creek-Nethunter-adapters-modules.zip
          mkdir -p artifacts/release artifacts/modules artifacts/adapter-module/modules
          # Release package contains only kernel test inputs and a deliberately
          # minimal external-adapter module set. Do NOT ship the generated
          # vendor_boot.img: this build still uses historical module-list inputs,
          # so the phone's current Android 16 vendor_boot must remain untouched.
          test -s "$DIST_DIR/Image"
          cp "$DIST_DIR/Image" artifacts/release/Image
          if [ -s "$DIST_DIR/Image.gz" ]; then cp "$DIST_DIR/Image.gz" artifacts/release/Image.gz; fi

          echo "== VERIFY ORIGINAL DEVELOPER ADAPTER BASELINE AGAINST THIS BUILD =="
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/dr1408/Creek_Nethunter/releases/download/V1.0/adapters-modules.zip" \
            -o "$RUNNER_TEMP/Creek-Nethunter-upstream-adapters.zip"
          echo "af2a101f9802b39bbbe751f5b621091b61f03aa336f450aefe3c0e95214dc72b  $RUNNER_TEMP/Creek-Nethunter-upstream-adapters.zip" | sha256sum -c -
          python3 "$GITHUB_WORKSPACE/scripts/filter-upstream-adapter-modules.py" \
            --archive "$RUNNER_TEMP/Creek-Nethunter-upstream-adapters.zip" \
            --staging "$OUT_DIR/staging" \
            --gki-staging "$OUT_DIR/gki_kernel/staging" \
            --symvers-root "$OUT_DIR" \
            --target-list "$GITHUB_WORKSPACE/config/creek-adapter-module-targets.txt" \
            --report "$GITHUB_WORKSPACE/artifacts/logs/upstream-adapter-compatibility.txt"
          echo "== ADAPTER PACKAGE =="
          bash -x "$GITHUB_WORKSPACE/scripts/package-creek-adapters.sh" "$OUT_DIR/staging" artifacts/modules "$OUT_DIR/gki_kernel/staging"
          test -s artifacts/modules/MODULE-LIST.txt
          test ! -e artifacts/modules/qca_cld3_wlan.ko

          # Package as a KernelSU-compatible module. Keep payload inside the
          # module directory (no /system overlay, no metamodule requirement).
          # Deliberately omit service.sh/post-fs-data.sh: nothing loads at boot.
          cp -a artifacts/modules/. artifacts/adapter-module/modules/
          cp scripts/nhd artifacts/adapter-module/nhd
          cp scripts/nh-load.sh artifacts/adapter-module/nh-load.sh
          cp scripts/nh-action.sh artifacts/adapter-module/action.sh
          cp artifacts/modules/ON-DEMAND-LOADING.txt artifacts/adapter-module/README-ON-DEMAND.txt
          cp artifacts/modules/MODULE-STATUS.txt artifacts/adapter-module/MODULE-STATUS.txt
          cp artifacts/modules/MODULE-MANIFEST.txt artifacts/adapter-module/MODULE-MANIFEST.txt
          cp artifacts/modules/MODULE-LIST.txt artifacts/adapter-module/MODULE-LIST.txt
          cat > artifacts/adapter-module/module.prop <<'EOF_MODULE'
          id=creek_nethunter_adapters
          name=Creek NetHunter Adapter Modules (On-Demand)
          version=0.1.0
          versionCode=100
          author=Ferztie666
          description=KernelSU adapter module; external drivers load only when explicitly requested, never at boot
          EOF_MODULE
          cat > artifacts/adapter-module/customize.sh <<'EOF_CUSTOMIZE'
          # Permission setup only; deliberately does not load any modules.
          set_perm "$MODPATH/nhd" 0 0 0755
          set_perm "$MODPATH/nh-load.sh" 0 0 0755
          set_perm "$MODPATH/action.sh" 0 0 0755
          set_perm_recursive "$MODPATH/modules" 0 0 0755 0644
          EOF_CUSTOMIZE
          (cd artifacts/release && sha256sum -- * > SHA256SUMS)
          (cd artifacts/modules && sha256sum -- *.ko > SHA256SUMS)
          (cd artifacts/adapter-module && zip -r9 -q "$GITHUB_WORKSPACE/Creek-Nethunter-adapters-modules.zip" .)

          # Reuse the original developer's AnyKernel3 layout; replace only Image.gz.
          # This is still a CANDIDATE ZIP, not flash authorization.
          # Pin the original developer's known-good AK3 baseline by GitHub release digest.
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/dr1408/Creek_Nethunter/releases/download/V1.0/Creek-Nethunter-gki-AK3.zip" \
            -o "$RUNNER_TEMP/Creek-Nethunter-upstream-AK3.zip"
          echo "1e665e8e5dcd2b9d2e4a09a57493d6822f52a5b90d997695651a22ed84b848c3  $RUNNER_TEMP/Creek-Nethunter-upstream-AK3.zip" | sha256sum -c -
          mkdir -p artifacts/ak3
          unzip -q "$RUNNER_TEMP/Creek-Nethunter-upstream-AK3.zip" -d artifacts/ak3
          # Keep candidate installs blocked until Android 16 ABI/KMI and stock-module compatibility are proven.
          bash scripts/guard-creek-ak3.sh artifacts/ak3
          if [ -s "$DIST_DIR/Image.gz" ]; then
            cp "$DIST_DIR/Image.gz" artifacts/ak3/Image.gz
          else
            gzip -n -c "$DIST_DIR/Image" > artifacts/ak3/Image.gz
          fi
          cat > artifacts/ak3/FLASH-GATE.txt <<'EOF_AK3_GATE'
          CANDIDATE ONLY — NOT CLEARED TO FLASH
          Base: original developer Creek AnyKernel3 layout (V1.0).
          Image.gz: replaced by this workflow's custom build.
          Kernel source family: 5.15.167-android13-8.
          User's Android 16 stock kernel previously identified as 5.15.194-android13-8.
          The build must pass the upstream ABI/KMI check without any checker bypass. Proprietary vendor module compatibility on the current Android 16 phone remains unverified; this is candidate-only.
          Preserve the phone's existing vendor_boot, vendor_dlkm, and system_dlkm.
          Do not flash until boot/AVB, KernelSU, ABI/KMI, and on-device recovery checks pass.
          EOF_AK3_GATE
          (cd artifacts/ak3 && zip -qr9 "$GITHUB_WORKSPACE/Creek-Nethunter-gki-AK3-candidate.zip" .)
          unzip -tq Creek-Nethunter-gki-AK3-candidate.zip

          printf '%s\n'             'Creek NetHunter GKI build candidate (upstream ABI/KMI gate required)'             'Kernel family: 5.15.167-android13-8'             'ABI checker: active; bypass markers are fatal'             'KernelSU kernel integration: NOT VERIFIED; do not assume root survives this image'             'Runtime WLAN unload/forced con_mode: disabled'             'Baseband Guard: enabled, source SHA recorded; upstream revision not yet pinned'             'Generated vendor_boot.img is intentionally NOT packaged.'             'Current Android 16 stock vendor_boot must be preserved for the next gate.'             'Build-time ABI/KMI check must pass without bypass; device-side proprietary-module compatibility is still unverified.' 'No flash is authorized until device-side boot/vendor_boot/AVB/KMI verification.'             > artifacts/release/FLASH-GATE.txt

          # Keep the patched internal Qualcomm WLAN driver separate from USB adapters.
          # This is an audit/test payload only: do not install or flash it until the
          # device's stock WLAN module ABI, vermagic, symbol dependencies and load path
          # have been verified on the exact Android 16 build.
          mkdir -p artifacts/internal-wlan
          # creek-external-modules.mk normalizes the built QCACLD source output
          # to the expected internal module name after successful compilation.
          QCA_MODULE="$(find "$OUT_DIR/staging/lib/modules" -type f -path '*/vendor/qcom/opensource/wlan/qcacld-3.0/qca_cld3_wlan.ko' -print -quit)"
          test -n "$QCA_MODULE" && test -s "$QCA_MODULE"
          cp "$QCA_MODULE" artifacts/internal-wlan/qca_cld3_wlan.ko
          {
            echo "Creek internal Qualcomm WLAN module - AUDIT/TEST ONLY"
            echo "Module: qca_cld3_wlan.ko (built QCACLD output, normalized by the module wrapper)"
            echo "Purpose: patched QCACLD driver for internal WLAN (wlan0), not USB adapters"
            echo "Status: NOT FLASH-READY; device-side ABI/KMI, vermagic, symbols, dependencies and module load path are unverified"
            echo "Do not replace or unload the stock Qualcomm WLAN driver on a daily-use device."
            echo "Do not force con_mode or unload WLAN at boot."
          } > artifacts/internal-wlan/INSTALL-GATE.txt
          (cd artifacts/internal-wlan && sha256sum -- qca_cld3_wlan.ko > SHA256SUMS)
          (cd artifacts && zip -r9 -q ../Creek-Nethunter-gki-candidate.zip release)
          (cd artifacts && zip -r9 -q ../Creek-Nethunter-internal-wlan-audit.zip internal-wlan)
          unzip -tq Creek-Nethunter-gki-candidate.zip
          unzip -tq Creek-Nethunter-gki-AK3-candidate.zip
          unzip -tq Creek-Nethunter-adapters-modules.zip
          unzip -tq Creek-Nethunter-internal-wlan-audit.zip
          unzip -Z1 Creek-Nethunter-adapters-modules.zip | sort > artifacts/logs/adapter-zip-file-list.txt
          cp artifacts/modules/MODULE-STATUS.txt artifacts/logs/adapter-module-status.txt
          cp artifacts/modules/MODULE-MANIFEST.txt artifacts/logs/adapter-module-manifest.txt
          ls -lh Creek-Nethunter-*.zip
          echo "INTERNAL_WLAN_AUDIT_PACKAGE=PASS"
          echo "PACKAGE_RELEASE=PASS"

      - name: Audit stock-module coexistence and release gate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/verify-creek-stock-module-policy.sh
          bash scripts/verify-creek-stock-module-policy.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/artifacts/logs/stock-module-coexistence.txt"
          cat artifacts/logs/stock-module-coexistence.txt

      - name: Upload candidate artifacts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: creek-nethunter-safe-build
          path: |
            artifacts/logs/
            Creek-Nethunter-gki-candidate.zip
            Creek-Nethunter-gki-AK3-candidate.zip
            Creek-Nethunter-adapters-modules.zip
            Creek-Nethunter-internal-wlan-audit.zip
          if-no-files-found: warn
